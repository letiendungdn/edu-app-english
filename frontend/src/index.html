<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>IELTS Path</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#3446d4">
  <script>
    // Áp theme đã chọn trước khi Angular chạy để không nháy màu.
    try { var t = localStorage.getItem('ielts_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>

</body>
</html>
