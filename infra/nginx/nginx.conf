server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location @api_starting {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 503 '{"error":"SERVICE_STARTING","message":"Máy chủ đang khởi động, vui lòng thử lại sau ít giây."}';
    }

    location @web_starting {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 503 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="refresh" content="5"><title>Đang khởi động…</title></head><body><h1>Hệ thống đang khởi động…</h1></body></html>';
    }

    location /api/ {
        client_max_body_size 12m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 504 = @api_starting;
    }

    # Chỉ health ra ngoài. /actuator/prometheus để Prometheus đọc trong mạng Docker, không công khai số liệu.
    location /actuator/health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        error_page 502 504 = @api_starting;
    }

    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        error_page 502 504 = @api_starting;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        error_page 502 504 = @web_starting;
    }
}
