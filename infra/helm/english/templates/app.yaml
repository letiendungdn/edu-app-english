apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: english-gateway
  template:
    metadata:
      labels:
        app: english-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.image.gateway }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: platform
            - name: ENGLISH_DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redisHost | quote }}
            - name: JWT_SECRET
              value: {{ .Values.jwtSecret | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: english-web
  template:
    metadata:
      labels:
        app: english-web
    spec:
      containers:
        - name: web
          image: {{ .Values.image.web }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector:
    app: english-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app: english-web
  ports:
    - port: 80
      targetPort: 80
