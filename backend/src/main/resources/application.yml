server:
  port: 8080

spring:
  application:
    name: english-api
  profiles:
    default: dev
  datasource:
    # H2 chạy ở chế độ PostgreSQL để dùng chung một bộ migration với Postgres.
    url: jdbc:h2:file:./data/english;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  h2:
    console:
      enabled: true
      path: /h2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 0.0

app:
  # Ngày học (streak, lộ trình, giờ học) tính theo múi giờ người học, không theo múi giờ máy chủ.
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  jwt:
    # Profile khác dev bắt buộc APP_JWT_SECRET (tối thiểu 32 ký tự).
    secret: ${APP_JWT_SECRET:}
    expiration-days: 30
  ai:
    # Chấm Writing/Speaking bằng Claude. Để trống key thì bài nộp báo "AI chưa được cấu hình".
    api-key: ${APP_AI_API_KEY:}
    model: ${APP_AI_MODEL:claude-opus-5-5}
    daily-limit: ${APP_AI_DAILY_LIMIT:10}
  storage:
    # Thư mục lưu file ghi âm Speaking.
    dir: ${APP_STORAGE_DIR:./data/uploads}
  roadmap:
    default-weeks: 12
    weeks-per-half-band: 8
    baseline-daily-minutes: 75
    phase-ratio:
      foundation: 0.25
      skill-building: 0.45
      exam-practice: 0.20
      final-review: 0.10
  cors-origins: http://localhost:4200,http://127.0.0.1:4200
  # Origin được phép mở WebSocket. Gồm cổng Nginx 8088 vì Nginx đổi Host nên Spring không coi là cùng origin.
  ws-origins: ${app.cors-origins},http://localhost:8088,http://127.0.0.1:8088

---
spring:
  config:
    activate:
      on-profile: dev
app:
  jwt:
    secret: ${APP_JWT_SECRET:edu-english-dev-secret-key-please-change-32}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ENGLISH_DATABASE_URL:jdbc:postgresql://localhost:5432/english_learning}
    driver-class-name: org.postgresql.Driver
    username: ${ENGLISH_DB_USER:postgres}
    password: ${ENGLISH_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
