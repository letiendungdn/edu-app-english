server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/english;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt:
    secret: edu-english-dev-secret-key-please-change-32
    expiration-days: 30
  cors-origins: http://localhost:4200,http://127.0.0.1:4200

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ENGLISH_DATABASE_URL:jdbc:postgresql://localhost:5432/english_learning}
    driver-class-name: org.postgresql.Driver
    username: ${ENGLISH_DB_USER:postgres}
    password: ${ENGLISH_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
