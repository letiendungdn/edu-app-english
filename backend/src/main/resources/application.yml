server:
  port: 8080

spring:
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/english;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Schema H2 hiện có (do Hibernate tạo trước Flyway) được đánh dấu đã ở V1, không chạy lại CREATE.
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt:
    # Profile khác dev bắt buộc APP_JWT_SECRET. Profile dev có giá trị mặc định ở document bên dưới.
    secret: ${APP_JWT_SECRET:}
    expiration-days: 30
  ai:
    api-key: ${APP_AI_API_KEY:}
    provider: ${APP_AI_PROVIDER:}
    model: ${APP_AI_MODEL:}
  cors-origins: http://localhost:4200,http://127.0.0.1:4200

---
spring:
  config:
    activate:
      on-profile: dev
app:
  jwt:
    secret: ${APP_JWT_SECRET:edu-english-dev-secret-key-please-change-32}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ENGLISH_DATABASE_URL:jdbc:postgresql://localhost:5432/english_learning}
    driver-class-name: org.postgresql.Driver
    username: ${ENGLISH_DB_USER:postgres}
    password: ${ENGLISH_DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/postgresql
